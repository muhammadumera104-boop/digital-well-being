<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MindBridge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f5f8b">
<meta name="description" content="A private phone companion for students: decide before you open the phone, get a warning before time is up, wind down at night, and always know where a real person is.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Layout concept: one phone-width column. Calm "bridge at dusk" blues, a warm lamp-amber for gentle warnings, coral only on the help screen. System fonts only, so the app makes zero third-party requests. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface-2:#f3f6f8; --line:#d8e0e6;
  --ink:#14232b; --muted:#53636f;
  --primary:#1f5f8b; --on-primary:#ffffff; --primary-soft:#e1edf5; --primary-ink:#174a6c;
  --warm:#f2b441; --warm-soft:#fff3d9; --warm-ink:#6b4500;
  --help-soft:#fdece1; --help-ink:#8a3b0f; --help:#b4501a;
  --c-study:#2b6cb0; --c-work:#2a8a7f; --c-fun:#7a5ccf; --c-social:#c98a1b; --c-sleep:#5b5fc7; --c-mood:#d9822b;
  --shadow:0 1px 2px rgba(20,35,43,.06),0 8px 24px rgba(20,35,43,.06);
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d171d; --surface:#15222a; --surface-2:#1b2b35; --line:#2a3d49;
    --ink:#e7eff3; --muted:#9db0bc;
    --primary:#7bbdee; --on-primary:#07202f; --primary-soft:#1a3345; --primary-ink:#a9d6f5;
    --warm:#f2b441; --warm-soft:#3a2e12; --warm-ink:#f6d28a;
    --help-soft:#3a2418; --help-ink:#f5b894; --help:#f0a477;
    --c-study:#6aa7e0; --c-work:#4cbfae; --c-fun:#a58ce8; --c-social:#e0b04a; --c-sleep:#8f93ee; --c-mood:#f0a35a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d171d; --surface:#15222a; --surface-2:#1b2b35; --line:#2a3d49;
  --ink:#e7eff3; --muted:#9db0bc;
  --primary:#7bbdee; --on-primary:#07202f; --primary-soft:#1a3345; --primary-ink:#a9d6f5;
  --warm:#f2b441; --warm-soft:#3a2e12; --warm-ink:#f6d28a;
  --help-soft:#3a2418; --help-ink:#f5b894; --help:#f0a477;
  --c-study:#6aa7e0; --c-work:#4cbfae; --c-fun:#a58ce8; --c-social:#e0b04a; --c-sleep:#8f93ee; --c-mood:#f0a35a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:1.75rem;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:1.125rem;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:1rem}
a{color:var(--primary-ink)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding-block:12px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:560px){body{background:color-mix(in srgb,var(--bg) 82%,var(--ink) 18%)}.app{background:var(--bg);box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.15)}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between;flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.tiny{font-size:.78rem}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:1.15rem}
.brand svg{width:30px;height:30px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--surface-2)}
.card h2+.sub,.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.btn{min-height:48px;padding:10px 18px;border-radius:14px;border:1.5px solid transparent;font-weight:700;cursor:pointer;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--primary-soft);color:var(--primary-ink)}
.btn.warm{background:var(--warm);color:#3a2500}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.9rem;border-radius:12px}
.btn.link{background:none;border:none;color:var(--primary-ink);padding:6px 4px;min-height:40px;text-decoration:underline}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"],.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink)}
.chip.sm{min-height:36px;padding:4px 12px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-weight:700;font-size:.9rem}
input[type=text],input[type=number],input[type=time],input[type=tel],textarea,select{width:100%;min-height:46px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--primary);min-height:36px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-ink);font-size:.8rem;font-weight:700}
.pill.warm{background:var(--warm-soft);color:var(--warm-ink)}
.pill.ghost{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs ul{list-style:none;margin:0 auto;padding:6px max(6px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);max-width:480px;gap:2px}
.tabs button{width:100%;min-height:56px;border:0;background:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--primary-ink);background:var(--primary-soft)}
.tabs .help button{color:var(--help)}
.tabs .help button[aria-current="page"]{background:var(--help-soft);color:var(--help-ink)}
/* hero */
.hero{background:var(--primary);color:var(--on-primary);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero p{opacity:.9}
.hero .btn{background:var(--on-primary);color:var(--primary);width:100%;margin-top:14px;min-height:56px;font-size:1.05rem}
.hero svg.arc{position:absolute;right:-20px;top:-6px;width:170px;opacity:.18;pointer-events:none}
.hero>*:not(svg){position:relative}
/* faces */
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.face{min-height:64px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:1.6rem;line-height:1}
.face span{font-size:.68rem;font-weight:700;color:var(--muted)}
.face[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
/* reasons grid */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.reason{min-height:84px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left}
.reason .ico{width:26px;height:26px}
.reason b{font-size:.98rem}
.reason small{color:var(--muted)}
.reason[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
/* stepper */
.stepper{display:flex;align-items:center;gap:10px}
.stepper input{text-align:center;font-weight:800;font-size:1.4rem;max-width:110px}
.stepper .icon-btn{flex:none}
/* clock */
.clockwrap{display:grid;place-items:center;position:relative;margin:6px auto 2px;width:230px;height:230px}
.clockwrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.clockwrap .ring-bg{stroke:var(--line)}
.clockwrap .ring{stroke:var(--primary);transition:stroke-dashoffset .9s linear}
.clockwrap.warn .ring{stroke:var(--warm)}
.clockwrap .t{position:relative;text-align:center}
.clockwrap .t b{display:block;font-size:2.6rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.banner{border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:var(--warm-soft);color:var(--warm-ink);border:1px solid color-mix(in srgb,var(--warm) 50%,transparent)}
.banner.calm{background:var(--primary-soft);color:var(--primary-ink);border-color:transparent}
.note{border-radius:14px;padding:10px 12px;background:var(--surface-2);border:1px dashed var(--line);font-size:.86rem;color:var(--muted)}
.help-card{background:var(--help-soft);border-color:transparent;color:var(--help-ink)}
.help-card h2,.help-card a.big{color:var(--help-ink)}
.contact{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.contact:first-of-type{border-top:0}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
details{border-top:1px solid var(--line);padding:2px 0}
details:first-of-type{border-top:0}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700;list-style:none;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:1.3rem;color:var(--muted)}
details[open] summary::after{content:"–"}
details>div{padding:0 0 12px;color:var(--muted);font-size:.93rem}
details ol,details ul,.steps{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:8px}
.check{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{width:24px;height:24px;accent-color:var(--primary);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
/* charts */
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.stacked{display:flex;height:22px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.stacked i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--dot);margin-right:6px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
.tile{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.tile b{display:block;font-size:1.35rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,16,22,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.modal{background:var(--surface);width:min(480px,100%);max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@media (min-width:560px){.overlay{align-items:center}.modal{border-radius:24px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast:empty{display:none}
.breath{width:64px;height:64px;border-radius:50%;background:var(--primary-soft);border:2px solid var(--primary);margin:2px auto;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.breath{transform:none}}
.welcome{padding-top:20px;gap:18px}
.welcome .logo{width:64px;height:64px}
ul.plain{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
ul.plain li{display:flex;gap:10px;align-items:flex-start}
ul.plain li .ico{color:var(--primary);margin-top:2px;width:20px;height:20px}
.swap-text{font-size:1.15rem;font-weight:700;line-height:1.3;text-wrap:balance}
</style>
</head>

<script id="core">
/* MindBridge core: pure logic, no DOM. Unit-tested with `node --test test/core.test.mjs`. */
const MBCore = (() => {
  const SCHEMA_VERSION = 1;
  const WARN_MS = 5 * 60 * 1000;
  const EXT_MIN = 5;
  const FOCUS_IDS = ['control', 'sleep', 'interruptions', 'mood', 'connection', 'help'];
  const MAX_FOCUS = 4;
  const GROUP_OF = { study: 'study', gaming: 'fun', watching: 'fun', news: 'social', client: 'work', chats: 'social' };
  const pad = n => String(n).padStart(2, '0');

  function dateKey(d) { d = d instanceof Date ? d : new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(key, n) { const [y, m, d] = key.split('-').map(Number); return dateKey(new Date(y, m - 1, d + n)); }
  function uid(now) { return 's' + now.toString(36) + Math.random().toString(36).slice(2, 6); }

  function defaultState() {
    return {
      version: SCHEMA_VERSION,
      profile: { focusAreas: [], consentAt: null },
      checkins: [],
      sessions: [],
      active: null,
      pair: null,
      settings: {
        quietFrom: '22:30', quietTo: '07:00', allowedContacts: [],
        windDownItems: [], notificationsAllowed: false, theme: 'auto', lang: 'en'
      },
      contacts: { counselor: { name: '', phone: '' }, trusted: { name: '', phone: '' } },
      windDownDone: { date: '', ids: [] }
    };
  }

  /* Bring any stored object up to the current schema. Unknown keys are dropped. */
  function migrate(raw) {
    const base = defaultState();
    if (!raw || typeof raw !== 'object') return base;
    const arr = v => Array.isArray(v) ? v : [];
    if (raw.profile) {
      base.profile.focusAreas = arr(raw.profile.focusAreas).filter(x => FOCUS_IDS.includes(x)).slice(0, MAX_FOCUS);
      base.profile.consentAt = typeof raw.profile.consentAt === 'number' ? raw.profile.consentAt : null;
    }
    base.checkins = arr(raw.checkins).filter(c => c && typeof c.date === 'string' && c.mood >= 1 && c.mood <= 5);
    base.sessions = arr(raw.sessions).filter(s => s && s.id && s.type && s.startedAt);
    base.active = raw.active && raw.active.id && raw.active.startedAt ? raw.active : null;
    base.pair = raw.pair && raw.pair.studySessionId ? raw.pair : null;
    if (raw.settings && typeof raw.settings === 'object') {
      const s = raw.settings;
      if (typeof s.quietFrom === 'string') base.settings.quietFrom = s.quietFrom;
      if (typeof s.quietTo === 'string') base.settings.quietTo = s.quietTo;
      base.settings.allowedContacts = arr(s.allowedContacts).filter(x => typeof x === 'string').slice(0, 20);
      base.settings.windDownItems = arr(s.windDownItems).filter(x => x && x.id && x.text);
      base.settings.notificationsAllowed = !!s.notificationsAllowed;
      if (['auto', 'light', 'dark'].includes(s.theme)) base.settings.theme = s.theme;
    }
    if (raw.contacts) for (const k of ['counselor', 'trusted']) {
      const c = raw.contacts[k];
      if (c && typeof c === 'object') base.contacts[k] = { name: String(c.name || ''), phone: String(c.phone || '') };
    }
    if (raw.windDownDone && typeof raw.windDownDone.date === 'string') base.windDownDone = { date: raw.windDownDone.date, ids: arr(raw.windDownDone.ids) };
    base.version = SCHEMA_VERSION;
    return base;
  }

  /* ---- check-ins and the gentle nudge ---- */
  function isHeavy(c) { return c.mood <= 2 || (typeof c.sleepHours === 'number' && c.sleepHours <= 4); }
  /* Two heavy check-ins on different days inside the last three days (today included). */
  function heavyNudge(checkins, today) {
    const from = addDays(today, -2);
    const byDate = {};

    return Object.values(byDate).filter(isHeavy).length >= 2;
  }

  /* ---- sessions and timers ---- */
  function clampMin(m, fallback = 25) {
    m = Math.round(Number(m));
    if (!Number.isFinite(m)) return fallback;

  }
  const totalMin = s => s.plannedMin + (s.extended ? EXT_MIN : 0);
  const endsAt = s => s.startedAt + totalMin(s) * 60000;
  const remainingMs = (s, now) => endsAt(s) - now;
  const isOver = (s, now) => remainingMs(s, now) <= 0;
  /* Warn once, when 5 minutes remain. Sessions of 5 minutes or less are already short, so no warning. */
  function shouldWarn(s, now) {
    if (s.warned || s.plannedMin <= 5) return false;
    const r = remainingMs(s, now);
    return r > 0 && r <= WARN_MS;
  }

  function startSession(state, opts, now) {
    if (state.active) return null;
    const plannedMin = clampMin(opts.minutes);
    const s = { id: uid(now), type: opts.type, plannedMin, goal: String(opts.goal || '').trim().slice(0, 80), startedAt: now, extended: false, warned: false, overNotified: false };
    state.active = s;

  }

  function extendActive(state, now) {

    if (!a || a.extended) return false;
    if (isOver(a, now)) a.startedAt = now - a.plannedMin * 60000;
    a.extended = true;
    a.overNotified = false;
    return true;
  }
  function endActive(state, now, feltAfter) {
    const a = state.active;
    if (!a) return null;
    const s = { id: a.id, type: a.type, plannedMin: a.plannedMin, goal: a.goal, startedAt: a.startedAt, endedAt: now, extended: a.extended, feltAfter: feltAfter || null };
    state.sessions.push(s);
    if (state.sessions.length > 500) state.sessions.shift();

    return s;
  }
  /* Study first, then play. The reward window can start once the study session is logged as ended. */
  function pairStatus(state) {
    const p = state.pair;

  }
  function startPaired(state, now) {
    const st = pairStatus(state);

    const s = startSession(state, { type: st.type, minutes: st.minutes }, now);
    state.pair = null;
    return s;
  }

  /* ---- quiet hours ---- */
  const toMin = hhmm => { const [h, m] = String(hhmm).split(':').map(Number); return (h || 0) * 60 + (m || 0); };
  function quietNow(from, to, now) {
    const f = toMin(from), t = toMin(to), n = now.getHours() * 60 + now.getMinutes();
    if (f === t) return false;
    return f < t ? (n >= f && n < t) : (n >= f || n < t);
  }

  /* ---- weekly view ---- */
  function weekSummary(state, today) {
    const dates = []; for (let i = 6; i >= 0; i--) dates.push(addDays(today, -i));
    const lastN = new Set(dates);
    const byType = { study: 0, gaming: 0, watching: 0, news: 0, client: 0, chats: 0 };
    const sess = state.sessions.filter(s => lastN.has(dateKey(s.startedAt)));
    for (const s of sess) if (s.type in byType) byType[s.type] += totalMin(s);
    const cMap = {}; for (const c of state.checkins) if (lastN.has(c.date)) cMap[c.date] = c;
    const days = dates.map(d => {
      const [y, m, dd] = d.split('-').map(Number);
      return { date: d, label: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(y, m - 1, dd).getDay()], mood: cMap[d] ? cMap[d].mood : null, sleep: cMap[d] && typeof cMap[d].sleepHours === 'number' ? cMap[d].sleepHours : null };
    });
    return finishWeek(days, byType, sess.length + Object.keys(cMap).length > 0, false);
  }
  function finishWeek(days, byType, hasData, sample) {
    const avg = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((p, c) => p + c, 0) / v.length : null; };
    const groups = { study: 0, work: 0, fun: 0, social: 0 };
    for (const [t, m] of Object.entries(byType)) groups[GROUP_OF[t]] += m;
    return { days, byType, groups, avgSleep: avg(days.map(d => d.sleep)), avgMood: avg(days.map(d => d.mood)), total: Object.values(byType).reduce((p, c) => p + c, 0), hasData, sample };
  }
  /* Clearly labelled example data, shown until the student has their own entries. */
  function sampleWeek(today) {
    const moods = [3, 2, 4, 3, 3, 4, 3], sleeps = [6.5, 5, 7, 6, 5.5, 7.5, 6.5];
    const days = summaryDates(today).map((d, i) => Object.assign(d, { mood: moods[i], sleep: sleeps[i] }));

  }

    return out;
  }

  /* ---- misc ---- */
  function planFriendText(swap, when) {
    return 'Assalam o Alaikum! Are you free ' + (when || 'later today') + '? I was thinking: ' + swap.text.charAt(0).toLowerCase() + swap.text.slice(1) + '. Phones away. Let me know.';
  }

})();

</script>

    ${u.type === 'study' ? `<div class="card flat stack" style="gap:10px"><label class="check" style="border:0;padding:0"><input type="checkbox" data-act="pairToggle" ${u.pairOn ? 'checked' : ''}><span><b>Study first, then play</b><br><span class="small muted">Plan a reward window that opens when this study session ends.</span></span></label>
      ${u.pairOn ? `<div class="chips">${['gaming', 'watching'].map(x => `<button class="chip sm" data-act="pairType" data-v="${x}" aria-pressed="${u.pairType === x}">${esc(reasonOf(x).label)}</button>`).join('')}${[20, 30, 45].map(m => `<button class="chip sm" data-act="pairMin" data-v="${m}" aria-pressed="${Number(u.pairMin) === m}">${m} min</button>`).join('')}</div>` : ''}</div>` : ''}
  </div>`;
}

function viewSession() {
  const a = S.active, now = Date.now();
  if (a) return a && MB.isOver(a, now) ? sessionOver(a) : sessionRunning(a, now);
  const pair = MB.pairStatus(S);
  const todays = S.sessions.filter(s => MB.dateKey(s.startedAt) === today()).slice(-5).reverse();
  return `<main class="stack"><div><h1>Start a session</h1><p class="sub">Choose first, then go open your app.</p></div>
    ${pair ? `<section class="card ${pair.unlocked ? '' : 'flat'} stack" style="gap:10px"><div class="row between"><h2>${esc(reasonOf(pair.type).label)} window: ${pair.minutes} min</h2><span class="pill ${pair.unlocked ? '' : 'ghost'}">${pair.unlocked ? 'Unlocked' : 'Opens after study'}</span></div>
      <p class="small muted">${pair.unlocked ? 'Nice work on the study session. Your reward time is ready.' : 'Finish your study session to open this window. It is a plan you made, not a lock.'}</p>
      <div class="row"><button class="btn" data-act="startPaired" ${pair.unlocked ? '' : 'disabled'}>Start ${esc(reasonOf(pair.type).label.toLowerCase())} window</button><button class="btn link" data-act="clearPair">Remove</button></div></section>` : ''}
    <section class="card">${setupForm()}<button class="btn block" style="margin-top:16px" data-act="startSession">Start session</button></section>
    ${todays.length ? `<section class="card stack" style="gap:6px"><h2>Today so far</h2>${todays.map(s => `<div class="row between small" style="padding:6px 0;border-top:1px solid var(--line)"><span class="row" style="gap:8px">${ic(reasonOf(s.type).icon)} ${esc(reasonOf(s.type).label)}${s.goal ? ' · <span class="muted">' + esc(s.goal) + '</span>' : ''}</span><span class="muted">${s.plannedMin + (s.extended ? 5 : 0)} min${s.feltAfter ? ' · ' + s.feltAfter : ''}</span></div>`).join('')}</section>` : ''}
    <p class="note">MindBridge cannot see your real screen time or lock any app. You plan and log your own sessions. That is on purpose: it needs no permissions and nobody can watch you.</p>
  </main>`;
}

function sessionRunning(a, now) {
  const rem = MB.remainingMs(a, now), total = MB.totalMin(a) * 60000, warn = rem <= MB.WARN_MS && a.plannedMin > 5;
  const C = 2 * Math.PI * 98, off = C * (1 - Math.max(0, rem) / total);
  return `<main class="stack"><div><p class="eyebrow">${esc(reasonOf(a.type).label)}</p><h1>${a.goal ? esc(a.goal) : 'You are in a session'}</h1></div>
    ${warn ? `<div class="banner" role="alert">${ic('session')}<div><b>5 minutes left.</b><div class="small">A good moment to finish what you are on.</div></div></div>` : ''}
    <section class="card stack" style="align-items:center;gap:10px"><div class="clockwrap ${warn ? 'warn' : ''}" id="clockwrap"><svg viewBox="0 0 230 230" aria-hidden="true"><circle class="ring-bg" cx="115" cy="115" r="98" fill="none" stroke-width="12"/><circle class="ring" id="ring" cx="115" cy="115" r="98" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
      <div class="t"><b id="clock" role="timer">${fmtClock(rem)}</b><span class="small muted">of ${MB.totalMin(a)} min${a.extended ? ' (extended)' : ''}</span></div></div>
      <p class="small muted" style="text-align:center">Go and open your app. Keep this page open (or installed) so the reminder can reach you.</p>
      <button class="btn ghost block" data-act="finishNow">I'm done early</button></section>
    ${MB.pairStatus(S) ? `<p class="note">After this study session, your ${esc(reasonOf(S.pair.type).label.toLowerCase())} window (${S.pair.minutes} min) opens in the Session tab.</p>` : ''}
  </main>`;
}

function reframeCard() {
  const c = CONTENT.reframes[ui.reframe % CONTENT.reframes.length];
  return `<section class="card flat stack" style="gap:8px"><span class="eyebrow">A thought for the feed</span><p class="swap-text">${esc(c.text)}</p><p class="small muted">${esc(c.tip)}</p><div><button class="btn sm ghost" data-act="nextReframe">Another thought</button></div></section>`;
}
function swapPool() { return CONTENT.swaps.filter(s => ui.swapKind === 'all' || s.kind === ui.swapKind); }
function currentSwap() { const pool = swapPool(); return pool.find(s => s.id === ui.swapId) || pool[0]; }
function swapCard(compact) {
  const sw = currentSwap();
  return `<section class="card ${compact ? 'flat' : ''} stack" style="gap:10px"><div class="row between"><h2>${compact ? 'Try something offline' : 'Offline ideas'}</h2><button class="icon-btn" data-act="nextSwap" aria-label="Show another idea">${ic('shuffle')}</button></div>
    ${compact ? '' : `<div class="chips">${[['all', 'Any'], ['solo', 'On my own'], ['friends', 'With friends']].map(([k, l]) => `<button class="chip sm" data-act="swapKind" data-v="${k}" aria-pressed="${ui.swapKind === k}">${l}</button>`).join('')}</div>`}
    <p class="swap-text">${esc(sw.text)}</p><div class="row"><span class="pill ghost">${sw.kind === 'solo' ? 'On my own' : 'With friends'}</span><button class="btn sm soft" data-act="planFriend">Plan it with a friend</button></div></section>`;
}

function sessionOver(a) {
  const r = reasonOf(a.type), pair = MB.pairStatus(S);
  return `<main class="stack"><div><p class="eyebrow">${esc(r.label)}${a.goal ? ' · ' + esc(a.goal) : ''}</p><h1>Time's up. How did it go?</h1><p class="sub">No judgment. This only helps you see your own patterns.</p></div>
    <section class="card stack" style="gap:12px"><div class="chips" role="group" aria-label="How did it feel afterwards">${[['good', 'Good'], ['okay', 'Okay'], ['drained', 'Drained']].map(([v, l]) => `<button class="chip" data-act="felt" data-v="${v}" aria-pressed="${ui.felt === v}">${l}</button>`).join('')}</div>
      <button class="btn block" data-act="endSession">Log it and finish</button>
      ${a.extended ? `<p class="small muted" style="text-align:center">You used your one 5-minute extension.</p>` : `<button class="btn ghost block" data-act="extend">${ic('plus')} 5 more minutes (one time)</button>`}
    </section>
    ${r.social ? reframeCard() : ''}
    ${swapCard(true)}
    ${pair && !pair.unlocked && S.pair && S.pair.studySessionId === a.id ? `<p class="note">Finishing opens your ${esc(reasonOf(pair.type).label.toLowerCase())} window (${pair.minutes} min).</p>` : ''}
  </main>`;
}

function viewUnwind() {
  const done = S.windDownDone.date === today() ? S.windDownDone.ids : [], items = S.settings.windDownItems;
  const quiet = MB.quietNow(S.settings.quietFrom, S.settings.quietTo, new Date());
  return `<main class="stack"><div><h1>Unwind</h1><p class="sub">Close the day on your terms.</p></div>
    <section class="card stack" aria-labelledby="qh"><div class="row between"><h2 id="qh">Quiet hours</h2><span class="pill ${quiet ? 'warm' : 'ghost'}">${quiet ? 'On now' : 'Off now'}</span></div>
      <div class="row" style="flex-wrap:nowrap"><div class="field grow"><label for="qf">From</label><input type="time" id="qf" value="${S.settings.quietFrom}" data-bind="S.settings.quietFrom"></div><div class="field grow"><label for="qt">Until</label><input type="time" id="qt" value="${S.settings.quietTo}" data-bind="S.settings.quietTo"></div></div>
      <div class="field"><label for="ac">Who can still call me?</label>
        <div class="chips">${S.settings.allowedContacts.map((n, i) => `<span class="chip sm on">${esc(n)}<button class="btn link" style="min-height:24px;padding:0" data-act="rmContact" data-v="${i}" aria-label="Remove ${esc(n)}">${ic('x')}</button></span>`).join('') || '<span class="small muted">Nobody added yet. Names stay on this device.</span>'}</div>
        <div class="row" style="flex-wrap:nowrap"><input type="text" id="ac" maxlength="30" placeholder="e.g. Ammi, Abbu, my brother"><button class="btn soft" data-act="addContact">Add</button></div></div>
      <details><summary>Turn on Do Not Disturb: Android</summary><div>${esc(CONTENT.dnd.android)}</div></details>
      <details><summary>Turn on Focus: iPhone</summary><div>${esc(CONTENT.dnd.iphone)}</div></details>
      <p class="note">A website cannot silence other apps for you. Set the schedule once on your phone using the steps above; MindBridge keeps your plan and reminds you.</p></section>
    <section class="card stack" aria-labelledby="wd"><div class="row between"><h2 id="wd">Evening wind-down</h2><button class="btn sm ghost" data-act="wdEdit">${ui.wdEdit ? 'Done' : 'Edit list'}</button></div>
      <p class="sub">${done.length} of ${items.length} done today. Resets tomorrow.</p>
      <div>${items.map(it => `<div class="check ${done.includes(it.id) ? 'done' : ''}"><label class="row grow" style="flex-wrap:nowrap;cursor:pointer"><input type="checkbox" data-act="wdTick" data-v="${it.id}" ${done.includes(it.id) ? 'checked' : ''}><span>${esc(it.text)}</span></label>${ui.wdEdit ? `<button class="icon-btn" data-act="wdRemove" data-v="${it.id}" aria-label="Remove ${esc(it.text)}">${ic('trash')}</button>` : ''}</div>`).join('')}</div>
      ${ui.wdEdit ? `<div class="row" style="flex-wrap:nowrap"><input type="text" id="wdnew" maxlength="60" placeholder="Add your own step"><button class="btn soft" data-act="wdAdd">Add</button></div><button class="btn link" data-act="wdReset">Restore the default list</button>` : ''}</section>
    ${swapCard(false)}
    ${reframeCard()}
  </main>`;
}

function barRows(w) {
  const max = Math.max(1, ...Object.values(w.byType));
  const color = { study: 'var(--c-study)', gaming: 'var(--c-fun)', watching: 'var(--c-fun)', news: 'var(--c-social)', client: 'var(--c-work)', chats: 'var(--c-social)' };
  return CONTENT.reasons.map(r => `<div class="stack" style="gap:4px"><div class="row between small"><span class="row" style="gap:8px">${ic(r.icon)}${esc(r.label)}</span><b style="font-variant-numeric:tabular-nums">${fmtDur(w.byType[r.id])}</b></div><div class="bar" aria-hidden="true"><i style="width:${(w.byType[r.id] / max * 100).toFixed(1)}%;background:${color[r.id]}"></i></div></div>`).join('');
}
function sleepChart(w) {
  const W = 320, H = 150, L = 28, R = 8, T = 14, B = 24, bw = (W - L - R) / 7, y = v => T + (H - T - B) * (1 - v / 10);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hours slept, last 7 days">
    ${[0, 4, 8].map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}h</text>`).join('')}
    ${w.days.map((d, i) => { const cx = L + bw * i + bw / 2; return (d.sleep != null ? `<rect x="${cx - 12}" y="${y(d.sleep)}" width="24" height="${y(0) - y(d.sleep)}" rx="5" fill="var(--c-sleep)"/><text x="${cx}" y="${y(d.sleep) - 4}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${d.sleep}</text>` : `<text x="${cx}" y="${y(0) - 6}" text-anchor="middle">–</text>`) + `<text x="${cx}" y="${H - 8}" text-anchor="middle">${d.label}</text>`; }).join('')}</svg>`;
}
function moodChart(w) {
  const W = 320, H = 150, L = 28, R = 8, T = 12, B = 24, step = (W - L - R) / 7, y = v => T + (H - T - B) * (1 - (v - 1) / 4), x = i => L + step * i + step / 2;
  let path = '', prev = null;
  w.days.forEach((d, i) => { if (d.mood != null) { path += (prev === i - 1 ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d.mood).toFixed(1) + ' '; prev = i; } });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mood, last 7 days">
    ${[1, 3, 5].map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${FACES[v - 1]}</text>`).join('')}
    <path d="${path}" fill="none" stroke="var(--c-mood)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${w.days.map((d, i) => (d.mood != null ? `<circle cx="${x(i)}" cy="${y(d.mood)}" r="5" fill="var(--c-mood)" stroke="var(--surface)" stroke-width="2"/>` : '') + `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${d.label}</text>`).join('')}</svg>`;
}
function viewWeek() {
  let w = MB.weekSummary(S, today());
  if (!w.hasData) w = MB.sampleWeek(today());
  const G = [['study', 'Study', 'var(--c-study)'], ['work', 'Client work', 'var(--c-work)'], ['fun', 'Games & watching', 'var(--c-fun)'], ['social', 'Chats & news', 'var(--c-social)']];
  const moodWord = w.avgMood == null ? '–' : FACE_LABELS[Math.round(w.avgMood) - 1];
  return `<main class="stack"><div><h1>My week</h1><p class="sub">Private patterns, no scores. Last 7 days.</p></div>
    ${w.sample ? `<div class="banner calm">${ic('week')}<div><b>Example data.</b><div class="small">This is a sample week so you can see how it looks. Your own sessions and check-ins replace it.</div></div></div>` : ''}
    <div class="tiles"><div class="tile"><span class="tiny muted">Planned time</span><b>${Math.floor(w.total / 60)}h ${w.total % 60}m</b></div><div class="tile"><span class="tiny muted">Avg sleep</span><b>${w.avgSleep == null ? '–' : w.avgSleep.toFixed(1) + ' h'}</b></div><div class="tile"><span class="tiny muted">Avg mood</span><b>${moodWord}</b></div></div>
    <section class="card stack"><h2>Planned time by type</h2>${barRows(w)}</section>

      <div class="legend">${G.map(([k, l, c]) => `<span style="--dot:${c}">${l} <b>${fmtDur(w.groups[k])}</b></span>`).join('')}</div></section>
    <section class="card stack"><h2>Sleep</h2><p class="sub">Hours slept each night, from your check-ins.</p>${sleepChart(w)}</section>
    <section class="card stack"><h2>Mood</h2><p class="sub">A bad day is information, not failure.</p>${moodChart(w)}</section>
    <button class="btn ghost block" data-act="exportData">${ic('download')} Download my data (JSON)</button>
    <p class="tiny muted" style="text-align:center">The file is created on this device. Nothing is uploaded.</p></main>`;
}

      <div class="chips">${[10, 15, 30, 45, 60].map(x => `<button class="chip sm" data-act="setMin" data-v="${x}" aria-pressed="${Number(u.minutes) === x}">${x}</button>`).join('')}</div></div>
      <div class="field"><label for="goal">Goal (optional)</label><input type="text" id="goal" maxlength="80" value="${esc(u.goal)}" placeholder="${esc(reasonOf(u.type).goal)}" data-bind="setup.goal"></div>

  } else if (m === 'plan') {
    body = `<h2>Plan it with a friend</h2><p class="sub">Edit the message, then send it yourself. MindBridge never sends anything.</p><textarea id="plantext" aria-label="Message">${esc(ui.planText)}</textarea>
      <div class="row"><button class="btn" data-act="planCopy">${ic('copy')} ${ui.planCopied ? 'Copied' : 'Copy'}</button>${navigator.share ? `<button class="btn soft" data-act="planShare">${ic('share')} Share</button>` : ''}<a class="btn soft" id="wa" href="#" target="_blank" rel="noopener">Open in WhatsApp</a></div><button class="btn link" data-act="closeModal">Close</button>`;
  } else if (m === 'delete') {
    body = `<h2>Delete all your data?</h2><p class="small muted">This removes your check-ins, sessions, contacts and settings from this device. It cannot be undone, and there is no copy anywhere else.</p><button class="btn block" style="background:var(--help);color:#fff" data-act="deleteConfirm">Yes, delete everything</button><button class="btn ghost block" data-act="closeModal" data-autofocus>Keep my data</button>`;
  } else if (m === 'checkinSaved') {
    const msg = ui.savedMood <= 2 ? 'Thank you for being honest. A bad day is information, not failure.' : ui.savedMood === 3 ? 'Thanks. A steady day is a good day.' : 'Good to hear. Notice what helped today.';
    body = `<h2>Saved.</h2><p>${msg}</p><button class="btn block" data-act="closeModal" data-autofocus>OK</button>`;
  }
  return `<div class="overlay" data-act="overlay"><div class="modal" role="dialog" aria-modal="true" tabindex="-1">${body}</div></div>`;
}

/* ---------- render ---------- */
function activeBanner() {
  const a = S.active; if (!a || ui.tab === 'session') return '';
  const now = Date.now(), over = MB.isOver(a, now), warn = a.warned && a.plannedMin > 5;
  if (!over && !warn) return '';
  return `<div class="banner" role="alert" style="margin-bottom:12px"><div class="grow"><b>${over ? "Time's up." : '5 minutes left.'}</b><div class="small">${esc(reasonOf(a.type).label)}${a.goal ? ' · ' + esc(a.goal) : ''}</div></div><button class="btn sm warm" data-act="go" data-v="session">${over ? 'Wrap up' : 'Open'}</button></div>`;
}
function render() {
  const app = document.getElementById('app');
  let html;
  if (!S.profile.consentAt) html = viewWelcome();
  else {
    const views = { today: viewToday, session: viewSession, unwind: viewUnwind, week: viewWeek, help: viewHelp, prefs: viewPrefs };
    html = (ui.tab === 'prefs' ? '' : topBar()) + activeBanner() + (views[ui.tab] || viewToday)() + tabBar();
  }
  app.innerHTML = html + modalHtml();
  if (ui.modal === 'plan') { const wa = document.getElementById('wa'); if (wa) wa.href = 'https://wa.me/?text=' + encodeURIComponent(ui.planText); }
  if (ui.modal) { const m = app.querySelector('.modal'); (m.querySelector('[data-autofocus]') || m).focus({ preventScroll: true }); }
  document.title = S.active ? 'MindBridge · ' + fmtClock(MB.remainingMs(S.active, Date.now())) : 'MindBridge';
}
function go(tab) {
  ui.tab = tab; ui.modal = null; ui.felt = null; ui.editContact = null; ui.wdEdit = false;
  try { history.replaceState(null, '', '#' + (tab === 'help' ? 'get-help' : tab === 'week' ? 'my-week' : tab)); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
function tabFromHash() {
  const h = location.hash.slice(1), map = { today: 'today', session: 'session', unwind: 'unwind', 'my-week': 'week', 'get-help': 'help', prefs: 'prefs' };
  return map[h] || 'today';
}

/* ---------- actions ---------- */
function applyType(id) { const r = reasonOf(id); ui.setup.type = id; ui.setup.minutes = r.minutes; ui.setup.goal = ''; }
function setFocus(id, list, max) { const i = list.indexOf(id); if (i >= 0) list.splice(i, 1); else if (list.length < max) list.push(id); else toast('You can pick up to ' + max + '. Tap one to swap it out.'); }
function startFromSetup() {
  const u = ui.setup;
  const s = MB.startSession(S, { type: u.type, minutes: u.minutes, goal: u.goal, pair: u.type === 'study' && u.pairOn ? { type: u.pairType, minutes: u.pairMin } : null }, Date.now());
  if (!s) { toast('A session is already running.'); return; }
  save(); ui.modal = null; ui.setup.step = 1; ui.setup.goal = '';
  toast('Session started. Go and open your app.'); go('session');
}
function finishSession() {
  const done = MB.endActive(S, Date.now(), ui.felt);
  if (!done) return; ui.felt = null; save();
  const p = MB.pairStatus(S);
  toast(p && p.unlocked ? 'Logged. Your ' + reasonOf(p.type).label.toLowerCase() + ' window is open.' : 'Logged. Thanks for checking in with yourself.');
  render(); window.scrollTo(0, 0);
}
function exportData() {
  const blob = new Blob([MB.exportJSON(S)], { type: 'application/json' }), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'mindbridge-my-data.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Data file created on this device.');
}
function initCheckin() {
  const c = S.checkins.find(x => x.date === today());
  if (c) ui.checkin = { mood: c.mood, sleep: c.sleepHours == null ? 7 : c.sleepHours, pulled: c.pulledBy || null };
}

const actions = {
  go: v => go(v),
  focusPick: v => { setFocus(v, ui.welcome.focus, MB.MAX_FOCUS); render(); },
  accept: () => {
    if (!ui.welcome.focus.length) return;
    S.profile.focusAreas = ui.welcome.focus.slice(); S.profile.consentAt = Date.now(); ensureDefaults(); save(); applyTheme(); go('today');
  },
  focusSet: v => { const f = S.profile.focusAreas.slice(); setFocus(v, f, MB.MAX_FOCUS); if (f.length) { S.profile.focusAreas = f; save(); } else toast('Keep at least one focus area.'); render(); },
  mood: v => { ui.checkin.mood = Number(v); render(); },
  pulled: v => { ui.checkin.pulled = ui.checkin.pulled === v ? null : v; render(); },
  saveCheckin: () => {
    if (!ui.checkin.mood) return;
    const entry = { date: today(), mood: ui.checkin.mood, sleepHours: Number(ui.checkin.sleep), pulledBy: ui.checkin.pulled };
    S.checkins = S.checkins.filter(c => c.date !== entry.date).concat(entry).sort((a, b) => a.date < b.date ? -1 : 1).slice(-120);
    save(); ui.savedMood = entry.mood; ui.modal = 'checkinSaved'; render();
  },
  pauseOpen: () => { ui.setup.step = 1; ui.modal = 'pause'; render(); },
  pauseType: v => { applyType(v); ui.setup.step = 2; render(); },
  pauseBack: () => { ui.setup.step = 1; render(); },
  closeModal: () => { ui.modal = null; render(); },
  overlay: (v, el, e) => { if (e.target === el) { ui.modal = null; render(); } },
  pickType: v => { applyType(v); render(); },
  setMin: v => { ui.setup.minutes = Number(v); render(); },
  minStep: v => { ui.setup.minutes = MB.clampMin(Number(ui.setup.minutes) + Number(v), 25); render(); },
  pairToggle: () => { ui.setup.pairOn = !ui.setup.pairOn; render(); },
  pairType: v => { ui.setup.pairType = v; render(); },
  pairMin: v => { ui.setup.pairMin = Number(v); render(); },
  startSession: startFromSetup,
  startPaired: () => { const s = MB.startPaired(S, Date.now()); if (s) { save(); toast('Window started. Enjoy it, and stop when the timer says.'); go('session'); } },
  clearPair: () => { S.pair = null; save(); render(); },
  finishNow: () => { ui.felt = null; finishSession(); },
  felt: v => { ui.felt = ui.felt === v ? null : v; render(); },
  endSession: finishSession,
  extend: () => { if (MB.extendActive(S, Date.now())) { save(); toast('5 more minutes. This is your one extension.'); render(); } },
  nextSwap: () => { const p = swapPool(), i = p.findIndex(s => s.id === (currentSwap() || {}).id); ui.swapId = p[(i + 1) % p.length].id; render(); },
  swapKind: v => { ui.swapKind = v; ui.swapId = null; render(); },
  nextReframe: () => { ui.reframe++; render(); },
  planFriend: () => { ui.planText = MB.planFriendText(currentSwap(), 'this evening'); ui.planCopied = false; ui.modal = 'plan'; render(); },
  planCopy: async () => {
    const el = document.getElementById('plantext'); ui.planText = el.value;
    try { await navigator.clipboard.writeText(ui.planText); ui.planCopied = true; } catch (e) { el.select(); toast('Press and hold to copy the selected text.'); return; }
    render();
  },
  planShare: () => { const el = document.getElementById('plantext'); ui.planText = el.value; navigator.share({ text: ui.planText }).catch(() => {}); },
  addContact: () => { const el = document.getElementById('ac'), v = el.value.trim(); if (!v) return; S.settings.allowedContacts.push(v.slice(0, 30)); save(); render(); },
  rmContact: v => { S.settings.allowedContacts.splice(Number(v), 1); save(); render(); },
  wdTick: v => { const d = S.windDownDone; if (d.date !== today()) { d.date = today(); d.ids = []; } const i = d.ids.indexOf(v); if (i >= 0) d.ids.splice(i, 1); else d.ids.push(v); save(); render(); },
  wdEdit: () => { ui.wdEdit = !ui.wdEdit; render(); },
  wdRemove: v => { S.settings.windDownItems = S.settings.windDownItems.filter(x => x.id !== v); save(); render(); },
  wdAdd: () => { const el = document.getElementById('wdnew'), v = el.value.trim(); if (!v) return; S.settings.windDownItems.push({ id: 'u' + Date.now().toString(36), text: v.slice(0, 60) }); save(); render(); },
  wdReset: () => { S.settings.windDownItems = []; ensureDefaults(); save(); render(); },
  editContact: v => { ui.editContact = v; render(); },
  cancelContact: () => { ui.editContact = null; render(); },
  saveContact: v => { S.contacts[v] = { name: document.getElementById('cn-' + v).value.trim().slice(0, 40), phone: document.getElementById('cp-' + v).value.trim().slice(0, 20) }; save(); ui.editContact = null; toast('Saved on this device.'); render(); },
  theme: v => { S.settings.theme = v; save(); applyTheme(); render(); },
  notifToggle: async (v, el) => {
    if (!('Notification' in window)) return;
    if (!el.checked) { S.settings.notificationsAllowed = false; save(); render(); return; }
    let p = Notification.permission; if (p === 'default') { try { p = await Notification.requestPermission(); } catch (e) {} }
    S.settings.notificationsAllowed = p === 'granted'; save(); render();
  },
  exportData,
  deleteOpen: () => { ui.modal = 'delete'; render(); },
  deleteConfirm: () => {
    S = MB.deleteAll(localStorage, STORE_KEY); ensureDefaults();
    ui.modal = null; ui.tab = 'today'; ui.welcome.focus = []; ui.checkin = { mood: null, sleep: 7, pulled: null };
    document.documentElement.removeAttribute('data-theme'); try { history.replaceState(null, '', location.pathname); } catch (e) {}
    render(); toast('All your data is deleted.');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox' && e.type === 'click') { /* handled below via change */ return; }
  const fn = actions[el.dataset.act]; if (fn) fn(el.dataset.v, el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input[type=checkbox][data-act]')) { const fn = actions[el.dataset.act]; if (fn) fn(el.dataset.v, el, e); return; }
  if (el.dataset.bind && el.dataset.bind.startsWith('S.')) { setPath(el.dataset.bind, el.value); save(); render(); }
});
document.addEventListener('input', e => {
  const b = e.target.dataset && e.target.dataset.bind; if (!b || b.startsWith('S.')) return;
  setPath('ui.' + b, e.target.type === 'number' || e.target.type === 'range' ? e.target.value : e.target.value);
  document.querySelectorAll('[data-mirror="' + b + '"]').forEach(n => { n.textContent = e.target.value; });
});
function setPath(path, val) {
  const parts = path.split('.'), root = parts[0] === 'S' ? S : ui; let o = root;
  for (let i = 1; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = val;
}
document.addEventListener('keydown', e => {
  if (!ui.modal) return;
  if (e.key === 'Escape') { ui.modal = null; render(); return; }
  if (e.key === 'Tab') {
    const m = document.querySelector('.modal'); const f = [...m.querySelectorAll('button,a[href],input,textarea,select')].filter(x => !x.disabled);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === m)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
window.addEventListener('hashchange', () => { const t2 = tabFromHash(); if (S.profile.consentAt && t2 !== ui.tab) { ui.tab = t2; ui.modal = null; render(); } });

/* ---------- timer loop ---------- */
function tick() {
  const a = S.active; if (!a) return;
  const now = Date.now(); let redraw = false;
  if (MB.shouldWarn(a, now)) { a.warned = true; save(); notify('5 minutes left', 'A good moment to finish what you are on.'); buzz(); redraw = true; }
  if (MB.isOver(a, now) && !a.overNotified) { a.overNotified = true; save(); notify("Time's up", 'Open MindBridge to wrap up. No rush, no judgment.'); buzz(); redraw = true; }
  if (redraw && !ui.modal) { render(); return; }
  const rem = MB.remainingMs(a, now), clock = document.getElementById('clock');
  document.title = 'MindBridge · ' + fmtClock(rem);
  if (clock) {
    clock.textContent = fmtClock(rem);
    const ring = document.getElementById('ring'), C = 2 * Math.PI * 98;
    if (ring) ring.setAttribute('stroke-dashoffset', (C * (1 - Math.max(0, rem) / (MB.totalMin(a) * 60000))).toFixed(1));
  }
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

/* ---------- boot ---------- */
applyTheme(); initCheckin(); ui.tab = tabFromHash(); render(); tick();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__MB = { get state() { return S; }, ui, render, go };
})();
</script>
</body>
</html>
